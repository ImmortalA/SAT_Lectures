<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Materials</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>SAT Materials</h1>
    <nav class="tabs" role="tablist">
      <button id="tab-rw" class="tab active" role="tab" aria-selected="true" aria-controls="panel-rw">Reading &amp; Writing</button>
      <button id="tab-math" class="tab" role="tab" aria-selected="false" aria-controls="panel-math">Math</button>
      <button id="tab-processed" class="tab" role="tab" aria-selected="false" aria-controls="panel-processed">Processed Units</button>
      <button id="tab-rubric" class="tab" role="tab" aria-selected="false" aria-controls="panel-rubric">Plan &amp; Rubric</button>
    </nav>
  </header>

  <main>
    <section id="panel-rw" class="panel" role="tabpanel" aria-labelledby="tab-rw">
      <aside>
        <input id="rw-search" type="text" placeholder="Search R&W lessons..." aria-label="Search Reading & Writing lessons" />
        <ul id="rw-list"></ul>
      </aside>
      <section class="content" id="rw-content">
        <div class="content-header">
          <h2 id="rw-title">Choose a lesson</h2>
          <div id="rw-meta"></div>
        </div>
        <div id="rw-body"></div>
      </section>
    </section>

    <section id="panel-math" class="panel hidden" role="tabpanel" aria-labelledby="tab-math">
      <aside>
        <input id="math-search" type="text" placeholder="Search Math units..." aria-label="Search Math units" />
        <ul id="math-list"></ul>
      </aside>
      <section class="content" id="math-content">
        <div class="content-header">
          <h2 id="math-title">Choose a unit</h2>
          <div id="math-meta"></div>
        </div>
        <div id="math-body"></div>
      </section>
    </section>

    <section id="panel-processed" class="panel hidden" role="tabpanel" aria-labelledby="tab-processed">
      <aside>
        <input id="processed-search" type="text" placeholder="Search processed units..." aria-label="Search processed units" />
        <ul id="processed-list"></ul>
      </aside>
      <section class="content" id="processed-content">
        <div class="content-header">
          <h2 id="processed-title">Choose a processed unit</h2>
          <div id="processed-meta"></div>
        </div>
        <div id="processed-body"></div>
      </section>
    </section>

    <section id="panel-rubric" class="panel hidden" role="tabpanel" aria-labelledby="tab-rubric">
      <aside>
        <div class="content-block">
          <div class="pill">Controls</div>
          <label for="rubric-section-filter">Section</label>
          <select id="rubric-section-filter" aria-label="Filter by section">
            <option value="all">All</option>
            <option value="Reading &amp; Writing">Reading &amp; Writing</option>
            <option value="Math">Math</option>
          </select>
        </div>
        <div class="content-block">
          <div class="pill">Goals</div>
          <label for="rubric-target-points">Target improvement (+points)</label>
          <input id="rubric-target-points" type="number" min="0" step="5" placeholder="e.g., 50" />
          <label for="rubric-target-weeks" style="margin-top:8px; display:block;">Time available (weeks)</label>
          <input id="rubric-target-weeks" type="number" min="0" step="1" placeholder="e.g., 4" />
          <button id="rubric-apply" class="tab" style="margin-top:10px;">Suggest Plan</button>
        </div>
      </aside>
      <section class="content" id="rubric-content">
        <div class="content-header">
          <h2>Plan &amp; Rubric</h2>
          <div id="rubric-meta"></div>
        </div>
        <div id="rubric-body"></div>
      </section>
    </section>
  </main>

  <footer>
    <span>© 2025 SAT Materials</span>
  </footer>

  <script src="src/app.js"></script>
</body>
</html>
