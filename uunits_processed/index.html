<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Processed Units</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; }
    header { padding: 12px 16px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; }
    main { display: grid; grid-template-columns: 320px 1fr; gap: 0; min-height: calc(100vh - 56px); }
    aside { border-right: 1px solid #eee; padding: 12px; }
    #search { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
    ul#list { list-style: none; margin: 12px 0 0; padding: 0; }
    ul#list li.unit-header { margin: 8px 0 4px; font-weight: 600; color: #555; }
    ul#list li.lesson-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
    ul#list li.lesson-item:hover { background: #f4f6f8; }
    ul#list li.lesson-item.active { background: #e6f0ff; }
    section#content { padding: 16px; }
    .pill { display: inline-block; background: #f0f2f5; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-right: 6px; }
    .content-block { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0; font-size: 18px;">Processed Units Viewer</h1>
  </header>
  <main>
    <aside>
      <input id="search" type="text" placeholder="Search processed units..." aria-label="Search processed units" />
      <div style="margin-top:8px; font-size:12px; color:#666;">Or load local JSON files:</div>
      <input id="file-picker" type="file" accept="application/json" multiple style="margin-top:6px; width:100%;" />
      <ul id="list"></ul>
    </aside>
    <section id="content">
      <div class="content-block">
        <div class="pill">Info</div>
        <div>Select a processed unit on the left.</div>
      </div>
      <div class="content-header">
        <h2 id="title">Choose a processed unit</h2>
        <div id="meta"></div>
      </div>
      <div id="body"></div>
    </section>
  </main>
  <script src="app.js"></script>
  </body>
  </html>
